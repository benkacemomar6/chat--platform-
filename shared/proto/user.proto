syntax = "proto3";
package user;

service UserService {
    rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
    rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
}
message GetProfileRequest {
    string userId = 1;
}

message GetProfileResponse {
    string userId = 1;
    string username = 2;
    string bio = 3;
    string avatarUrl = 4;
}
message UpdateProfileRequest{
    string userId = 1;
    string username = 2;
    string bio = 3;
    string avatarUrl = 4;

}
message UpdateProfileResponse{
    string userId = 1;
    string username = 2;
    string bio = 3;
    string avatarUrl = 4;

}